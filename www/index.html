<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Фокус</title>
  <style>
    :root { --bg: #FAFAFA; --card: #FFFFFF; --text: #111; --muted: #666; --border: #E5E5E5; --primary: #111; --sec: #EFEFEF; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 440px; padding: 24px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
    .scr { display: none; flex-direction: column; }
    .scr.act { display: flex; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    h1 { font-size: 38px; font-weight: 800; margin-bottom: 8px; }
    h2 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 15px; color: var(--muted); line-height: 1.4; margin-bottom: 24px; }
    .lbl { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }
    .link { background: none; border: none; font-size: 16px; font-weight: 600; color: var(--text); cursor: pointer; }
    input, textarea { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-size: 16px; color: var(--text); margin-bottom: 12px; outline: none; }
    .g-in { font-size: 22px; font-weight: 600; border: none; border-bottom: 2px solid var(--primary); border-radius: 0; padding: 8px 0; background: transparent; resize: none; }
    .btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; margin-bottom: 10px; }
    .btn-p { background: var(--primary); color: #FFF; }
    .btn-s { background: var(--sec); color: var(--text); }
    .btn-g { background: transparent; color: var(--muted); }
    .g-txt { font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 16px; word-break: break-word; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
    .s-row { display: flex; align-items: center; text-align: center; }
    .s-box { flex: 1; }
    .s-num { font-size: 32px; font-weight: 700; }
    .s-lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .div { width: 1px; height: 40px; background: var(--border); }
    .msg { color: #d32f2f; font-size: 14px; text-align: center; margin-bottom: 10px; min-height: 18px; }
    .btn-big { padding: 22px; font-size: 18px; border-radius: 16px; }
  </style>
</head>
<body>
<div class="app">

  <div id="scr-login" class="scr act">
    <h1>Фокус.</h1>
    <p class="sub">Укажите Email для синхронизации прогресса или войдите локально.</p>
    <input type="text" id="in-name" placeholder="Ваше имя" />
    <input type="email" id="in-email" placeholder="Email" />
    <div id="login-msg" class="msg"></div>
    <button type="button" id="b-login" class="btn btn-p">Продолжить</button>
    <button type="button" id="b-local" class="btn btn-g">Войти локально</button>
  </div>

  <div id="scr-main" class="scr">
    <div class="row">
      <div>
        <div style="font-size:17px;color:#666" id="u-greet">Привет</div>
        <div style="font-size:12px;color:#888" id="u-sync">Готово</div>
      </div>
      <button type="button" id="b-set" class="link">Настройки</button>
    </div>
    <div style="margin-bottom:28px">
      <span class="lbl">Главная цель сейчас</span>
      <div id="g-view">
        <div class="g-txt" id="g-disp">Не задана</div>
        <button type="button" id="b-edit" class="btn btn-s">Изменить цель</button>
      </div>
      <div id="g-edit" style="display:none">
        <textarea id="in-goal" class="g-in" rows="2" placeholder="Например: Учить английский"></textarea>
        <button type="button" id="b-save-g" class="btn btn-p">Сохранить цель</button>
      </div>
    </div>
    <div class="card">
      <span class="lbl">Статистика за сегодня</span>
      <div class="s-row">
        <div class="s-box"><div class="s-num" id="st-f">0</div><div class="s-lbl">В фокусе</div></div>
        <div class="div"></div>
        <div class="s-box"><div class="s-num" id="st-d">0</div><div class="s-lbl">Отвлёкся</div></div>
      </div>
    </div>
    <button type="button" id="b-chk" class="btn btn-g">Сделать чекин сейчас</button>
    <button type="button" id="b-out" class="btn btn-g" style="font-size:13px">Сменить аккаунт</button>
  </div>

  <div id="scr-set" class="scr">
    <div class="row"><h2>Настройки</h2><button type="button" id="b-cls" class="link">Закрыть</button></div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:600">Случайные напоминания</div><div style="font-size:13px;color:#666" id="m-desc">По таймеру</div></div>
      <input type="checkbox" id="tg-rnd" style="width:24px;height:24px;margin:0">
    </div>
    <div class="card" id="bx-int"><span class="lbl">Интервал (минут)</span><input type="number" id="in-int" value="60" min="1" /></div>
    <div class="card" id="bx-rnd" style="display:none"><span class="lbl">Часы (с — до)</span><div style="display:flex;gap:12px"><input type="number" id="in-s" value="9" /><input type="number" id="in-e" value="21" /></div></div>
    <button type="button" id="b-save-s" class="btn btn-p">Сохранить</button>
    <button type="button" id="b-test" class="btn btn-s">Тест пуша (через 3 сек)</button>
  </div>

  <div id="scr-chk" class="scr">
    <span class="lbl">Текущая цель</span>
    <div style="font-size:20px;font-weight:700;margin-bottom:20px" id="c-goal">Не задана</div>
    <div style="font-size:26px;font-weight:600;margin-bottom:28px" id="c-q">Где сейчас твоё внимание?</div>
    <button type="button" id="b-yes" class="btn btn-p btn-big">Я в фокусе</button>
    <button type="button" id="b-no" class="btn btn-s btn-big">Отвлёкся, возвращаюсь</button>
  </div>

</div>

  let tId = null;

    document.querySelectorAll('.scr').forEach(el => el.classList.remove('act'));
    document.getElementById('scr-' + id).classList.add('act');
    if (id === 'main') {
      document.getElementById('u-greet').innerText = 'Привет, ' + (st.user ? st.user.name : 'Гость');
      document.getElementById('st-f').innerText = st.stats.f;
      document.getElementById('st-d').innerText = st.stats.d;
      document.getElementById('g-disp').innerText = st.goal || 'Не задана';
      document.getElementById('g-view').style.display = st.goal ? 'block' : 'none';
      document.getElementById('g-edit').style.display = st.goal ? 'none' : 'block';
    }
    if (id === 'set') {
      document.getElementById('tg-rnd').checked = st.cfg.rnd;
      document.getElementById('in-int').value = st.cfg.int;
      document.getElementById('in-s').value = st.cfg.s;

      document.getElementById('c-goal').innerText = st.goal || 'Не задана';
      document.getElementById('c-q').innerText = getQ();
    }
  }

  function updMode() {
    const r = document.getElementById('tg-rnd').checked;
    document.getElementById('bx-int').style.display = r ? 'none' : 'block';

  }

    const arr = ['Чем ты сейчас занят?', 'На что сейчас направлено твоё внимание?', 'Ты приближаешься к цели: «' + (st.goal || 'Не задана') + '»?'];
    return arr.at(Math.floor(Math.random() * arr.length));
  }

    localStorage.setItem('focus_mob', JSON.stringify(st));

    try {
      const res = await fetch(SB_URL + '/rest/v1/focus_users', {
        method: 'POST',
        headers: { 'apikey': SB_KEY.trim(), 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({

    } catch (e) { el.innerText = 'Офлайн'; }

      if (!res.ok) return false;

      const d = rows.at(0);
      if (!d) return false;

<script>
  const SB_URL = 'https://supabase.co';
  const SB_KEY = 'ВСТАВЬТЕ_СЮДА_ВАШ_КЛЮЧ';

  let st = { user: null, goal: '', stats: { f: 0, d: 0, date: new Date().toDateString() }, cfg: { rnd: false, int: 60, s: 9, e: 21 } };
  let tId = null;

  function show(id) {
    document.querySelectorAll('.scr').forEach(el => el.classList.remove('act'));
    document.getElementById('scr-' + id).classList.add('act');
    if (id === 'main') {
      document.getElementById('u-greet').innerText = 'Привет, ' + (st.user ? st.user.name : 'Гость');
      document.getElementById('st-f').innerText = st.stats.f;
      document.getElementById('st-d').innerText = st.stats.d;
      document.getElementById('g-disp').innerText = st.goal || 'Не задана';
      document.getElementById('g-view').style.display = st.goal ? 'block' : 'none';
      document.getElementById('g-edit').style.display = st.goal ? 'none' : 'block';
    }
    if (id === 'set') {
      document.getElementById('tg-rnd').checked = st.cfg.rnd;
      document.getElementById('in-int').value = st.cfg.int;
      document.getElementById('in-s').value = st.cfg.s;
      document.getElementById('in-e').value = st.cfg.e;
      updMode();
    }
    if (id === 'chk') {
      document.getElementById('c-goal').innerText = st.goal || 'Не задана';
      document.getElementById('c-q').innerText = getQ();
    }
  }

  function updMode() {
    const r = document.getElementById('tg-rnd').checked;
    document.getElementById('bx-int').style.display = r ? 'none' : 'block';
    document.getElementById('bx-rnd').style.display = r ? 'block' : 'none';
    document.getElementById('m-desc').innerText = r ? 'Случайно в течение дня' : 'Строго по таймеру';
  }

  function getQ() {
    const arr = ['Чем ты сейчас занят?', 'На что сейчас направлено твоё внимание?', 'Ты приближаешься к цели: «' + (st.goal || 'Не задана') + '»?'];
    return arr.at(Math.floor(Math.random() * arr.length));
  }

  async function save() {
    localStorage.setItem('focus_mob', JSON.stringify(st));
    const el = document.getElementById('u-sync');
    if (!st.user || st.user.loc || SB_KEY.length < 15) { el.innerText = 'Локальный режим'; return; }
    el.innerText = 'Сохранение...';
    try {
      const res = await fetch(SB_URL + '/rest/v1/focus_users', {
        method: 'POST',
        headers: { 'apikey': SB_KEY.trim(), 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({
          user_key: st.user.key, name: st.user.name, email: st.user.email, goal: st.goal,
          focused: st.stats.f, distracted: st.stats.d, stats_date: st.stats.date,
          is_random: st.cfg.rnd, interval_min: st.cfg.int, start_hour: st.cfg.s, end_hour: st.cfg.e,
          updated_at: new Date().toISOString()
        })
      });
      el.innerText = res.ok ? 'Облако синхронизировано' : 'Ошибка записи';
    } catch (e) { el.innerText = 'Офлайн'; }
  }

  async function sync(key) {
    if (SB_KEY.length < 15) return false;
    try {
      const res = await fetch(SB_URL + '/rest/v1/focus_users?user_key=eq.' + encodeURIComponent(key), { headers: { 'apikey': SB_KEY.trim() } });
      if (!res.ok) return false;
      const rows = await res.json();
      const d = rows.at(0);
      if (!d) return false;
      const today = new Date().toDateString();
      st.user = { key: d.user_key, name: d.name, email: d.email, loc: false };
      st.goal = d.goal || '';
      st.stats = { f: d.stats_date === today ? (d.focused || 0) : 0, d: d.stats_date === today ? (d.distracted || 0) : 0, date: today };
      st.cfg = { rnd: Boolean(d.is_random), int: d.interval_min || 60, s: d.start_hour || 9, e: d.end_hour || 21 };
      localStorage.setItem('focus_mob', JSON.stringify(st));
      return true;
    } catch (e) { return false; }
  }

  async function pushNow(delaySec) {
    try {
      const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
      if (LN) {
        await LN.requestPermissions();
        await LN.schedule({ notifications: [{ title: 'Проверка фокуса', body: getQ(), id: Math.floor(Math.random() * 90000) + 1, schedule: { at: new Date(Date.now() + (delaySec || 1) * 1000) } }] });
        return;
      }
    } catch (e) {}
    setTimeout(() => show('chk'), (delaySec || 0) * 1000);
  }

  async function sched() {
    if (tId) clearTimeout(tId);
    if (!st.goal) return;
    try {
      const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
      if (LN) {
        await LN.requestPermissions();
        const p = await LN.getPending();
        if (p.notifications.length) await LN.cancel(p);
        if (!st.cfg.rnd) {
          await LN.schedule({ notifications: [{ title: 'Проверка фокуса', body: getQ(), id: 1, schedule: { every: 'minute', count: Math.max(1, st.cfg.int) } }] });
        } else {
          const list = [];
          for (let i = 1; i <= 6; i++) {
            const d = new Date();
            d.setHours(Math.floor(Math.random() * (st.cfg.e - st.cfg.s)) + st.cfg.s, Math.floor(Math.random() * 60), 0, 0);
            if (d <= new Date()) d.setDate(d.getDate() + 1);
            list.push({ title: 'Проверка фокуса', body: getQ(), id: i + 10, schedule: { at: d } });
          }
          await LN.schedule({ notifications: list });
        }
        return;
      }
    } catch (e) {}
    tId = setTimeout(() => { pushNow(0); sched(); }, (st.cfg.rnd ? (Math.floor(Math.random() * 76) + 15) : st.cfg.int) * 60000);
  }

  async function doLogin(loc) {
    const msg = document.getElementById('login-msg');
    msg.innerText = '';
    const name = document.getElementById('in-name').value.trim();
    const email = document.getElementById('in-email').value.trim().toLowerCase();
    if (!loc && !email) { msg.innerText = 'Введите Email или нажмите «Войти локально»'; return; }
    const btn = document.getElementById('b-login');
    btn.innerText = 'Загрузка...'; btn.disabled = true;
    if (loc) {
      st.user = { key: 'loc_' + Date.now(), name: name || 'Гость', email: '', loc: true };
      await save();
    } else {
      const ok = await sync(email);
      if (!ok) { st.user = { key: email, name: name || email.split('@').at(0), email: email, loc: false }; await save(); }
    }
    btn.innerText = 'Продолжить'; btn.disabled = false;
    show('main'); sched();
  }

  document.getElementById('b-login').onclick = () => doLogin(false);
  document.getElementById('b-local').onclick = () => doLogin(true);
  document.getElementById('b-set').onclick = () => show('set');
  document.getElementById('b-cls').onclick = () => show('main');
  document.getElementById('b-edit').onclick = () => { document.getElementById('g-view').style.display = 'none'; document.getElementById('g-edit').style.display = 'block'; document.getElementById('in-goal').value = st.goal; };
  document.getElementById('b-save-g').onclick = async () => { const v = document.getElementById('in-goal').value.trim(); if (v) { st.goal = v; show('main'); sched(); await save(); } };
  document.getElementById('b-chk').onclick = () => show('chk');
  document.getElementById('b-out').onclick = () => { localStorage.removeItem('focus_mob'); st.user = null; show('login'); };
  document.getElementById('tg-rnd').onchange = updMode;
  document.getElementById('b-save-s').onclick = async () => { st.cfg = { rnd: document.getElementById('tg-rnd').checked, int: Math.max(1, parseInt(document.getElementById('in-int').value) || 60), s: parseInt(document.getElementById('in-s').value) || 9, e: parseInt(document.getElementById('in-e').value) || 21 }; show('main'); sched(); await save(); };
  document.getElementById('b-test').onclick = () => pushNow(3);
  document.getElementById('b-yes').onclick = async () => { st.stats.f++; show('main'); await save(); };
  document.getElementById('b-no').onclick = async () => { st.stats.d++; show('main'); await save(); };

  (async function init() {
    try {
      const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
      if (LN) LN.addListener('localNotificationActionPerformed', () => show('chk'));
    } catch (e) {}
    const s = localStorage.getItem('focus_mob');
    if (s) st = Object.assign({}, st, JSON.parse(s));
    if (st.user && !st.user.loc) await sync(st.user.key);
    if (st.user) { show('main'); sched(); }
  })();
</script>
</body>
</html>
